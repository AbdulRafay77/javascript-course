<!DOCTYPE html>
<html>
  <head>
    <title>DOM project</title>
    <style>
      body{
        font-family: Arial;
      }

      .subscribe-button {
        border: none;
        background-color: black;
        color: white;
        padding-bottom: 10px;
        padding-top: 10px;
        padding-left: 15px;
        padding-right: 15px;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        margin-bottom: 30px;
      }
      .is-subscibed{
        background-color: rgb(240, 240, 240);
        color: black;
      }
      .cost-input {
        font-size: 15px;
        padding: 10px;
      }
      .calculate-button {
        background-color: green;
        color: white;
        border: none;
        font-size: 15px;
        padding: 12px 15px;
        cursor: pointer;
      }
      
  </style>
  </head>

  <body>
    <p>YouTube Subscibe Button</p>
    <button onclick="
      subscribe();
    " class="js-subscribe-button subscribe-button">Subscibe</button>

    <p>Amazon Shipping Calculator</p>
    <input placeholder="Cost of order" class="js-cost-input cost-input" onkeydown="
      handleCostKeydown(event);
    ">
    <button onclick="
      calculateTotal();
    " class="calculate-button">Calculate</button>
    <p class="js-total-cost"></p>

    <script>
      function handleCostKeydown (event) {
        if (event.key === 'Enter') {
          calculateTotal();
        }
      }

      function calculateTotal(){
        const inputElement = document.querySelector('.js-cost-input');
        let cost = Number(inputElement.value);
        if (cost < 40) {
          cost += 10;
        }

        document.querySelector('.js-total-cost')
          .innerHTML = `$${cost}`;
      }

      function subscribe () {
        const buttonElement = document.querySelector('.js-subscribe-button');
      
        if (buttonElement.innerHTML === 'Subscibe') {
          buttonElement.innerHTML = 'Subscibed';
          buttonElement.classList.add('is-subscibed');
        } else {
          buttonElement.innerHTML = 'Subscibe';
          buttonElement.classList.remove('is-subscibed');
        }
      }
    </script>
  </body>
</html>
